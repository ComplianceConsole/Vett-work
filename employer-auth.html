<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vett.work — Employer Login</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --navy: #0c1445;
  --emerald: #10b981;
  --emerald-light: #ecfdf5;
  --emerald-border: #a7f3d0;
  --emerald-dark: #059669;
  --white: #ffffff;
  --off: #f8fafc;
  --border: #e2e8f0;
  --muted: #64748b;
  --muted2: #94a3b8;
  --text: #0f172a;
  --error: #ef4444;
  --error-light: #fef2f2;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--navy);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

nav {
  padding: 0 48px;
  height: 64px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.logo { font-size: 20px; font-weight: 800; color: white; letter-spacing: -0.5px; text-decoration: none; }
.logo-dot { color: var(--emerald); }

.nav-back { font-size: 13px; color: rgba(255,255,255,0.4); text-decoration: none; display: flex; align-items: center; gap: 6px; transition: color 0.15s; }
.nav-back:hover { color: white; }
.nav-back svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none; }

main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
  position: relative;
  overflow: hidden;
}

main::before {
  content: '';
  position: absolute;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(16,185,129,0.07) 0%, transparent 65%);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

.auth-card {
  background: white;
  border-radius: 20px;
  padding: 40px;
  width: 100%;
  max-width: 440px;
  position: relative;
  z-index: 1;
  box-shadow: 0 24px 80px rgba(0,0,0,0.3);
}

.auth-logo { text-align: center; margin-bottom: 8px; }
.auth-logo span { font-size: 22px; font-weight: 800; color: var(--navy); letter-spacing: -0.5px; }
.auth-logo span em { font-style: normal; color: var(--emerald); }

.auth-title { font-size: 22px; font-weight: 800; color: var(--navy); letter-spacing: -0.5px; text-align: center; margin-bottom: 6px; }
.auth-sub { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 28px; line-height: 1.5; }

.auth-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  background: var(--off);
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 24px;
}

.auth-tab {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  padding: 9px;
  border-radius: 7px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}

.auth-tab.active { background: white; color: var(--navy); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }

.auth-form { display: none; flex-direction: column; gap: 12px; }
.auth-form.active { display: flex; }

.form-field { display: flex; flex-direction: column; gap: 5px; }

.form-field label {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

.form-field input, .form-field select {
  width: 100%;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px;
  color: var(--text);
  background: var(--off);
  border: 1.5px solid var(--border);
  border-radius: 9px;
  padding: 12px 16px;
  outline: none;
  transition: border-color 0.2s;
}

.form-field input:focus, .form-field select:focus { border-color: var(--emerald); }
.form-field input::placeholder { color: var(--muted2); }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.submit-btn {
  width: 100%;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 15px;
  font-weight: 700;
  padding: 14px;
  border-radius: 10px;
  border: none;
  background: var(--emerald);
  color: white;
  cursor: pointer;
  transition: background 0.15s;
  margin-top: 4px;
}

.submit-btn:hover { background: var(--emerald-dark); }
.submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

.auth-error {
  background: var(--error-light);
  border: 1px solid #fecaca;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  color: var(--error);
  display: none;
}

.auth-error.show { display: block; }

.auth-success {
  background: var(--emerald-light);
  border: 1px solid var(--emerald-border);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  color: var(--emerald-dark);
  display: none;
  line-height: 1.5;
}

.auth-success.show { display: block; }

.forgot-link {
  font-size: 12px;
  color: var(--emerald-dark);
  text-decoration: none;
  text-align: right;
  display: block;
  margin-top: -6px;
  font-weight: 600;
}

.forgot-link:hover { text-decoration: underline; }

.terms-note {
  font-size: 11px;
  color: var(--muted2);
  text-align: center;
  line-height: 1.5;
  margin-top: 4px;
}

.terms-note a { color: var(--muted); }

footer {
  padding: 20px 48px;
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex;
  justify-content: space-between;
}

footer p { font-size: 12px; color: rgba(255,255,255,0.18); }

@media (max-width: 480px) {
  nav { padding: 0 20px; }
  .auth-card { padding: 28px 20px; }
  .form-row { grid-template-columns: 1fr; }
  footer { padding: 16px 20px; flex-direction: column; gap: 8px; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">vett<span class="logo-dot">.</span>work</a>
  <a href="employer.html" class="nav-back">
    <svg viewBox="0 0 14 14"><line x1="12" y1="7" x2="2" y2="7"/><polyline points="6,3 2,7 6,11"/></svg>
    Back
  </a>
</nav>

<main>
  <div class="auth-card">
    <div class="auth-logo"><span>vett<em>.</em>work</span></div>
    <div class="auth-title">Employer account</div>
    <div class="auth-sub">Post roles, watch video profiles, and find the right person.</div>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('signup')">Create account</button>
      <button class="auth-tab" onclick="switchTab('login')">Sign in</button>
    </div>

    <!-- SIGNUP -->
    <div class="auth-form active" id="signupForm">
      <div class="auth-error" id="signupError"></div>
      <div class="auth-success" id="signupSuccess"></div>
      <div class="form-row">
        <div class="form-field">
          <label>First name</label>
          <input type="text" id="signupFirst" placeholder="First name">
        </div>
        <div class="form-field">
          <label>Last name</label>
          <input type="text" id="signupLast" placeholder="Last name">
        </div>
      </div>
      <div class="form-field">
        <label>Company name</label>
        <input type="text" id="signupCompany" placeholder="Your company or agency name">
      </div>
      <div class="form-field">
        <label>Company type</label>
        <select id="signupCompanyType">
          <option value="">Select...</option>
          <option value="direct">Direct employer</option>
          <option value="startup">Start-up</option>
          <option value="nfp">Not-for-profit</option>
          <option value="agency">Recruitment agency</option>
        </select>
      </div>
      <div class="form-field">
        <label>Email address</label>
        <input type="email" id="signupEmail" placeholder="your@company.com">
      </div>
      <div class="form-field">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="Minimum 8 characters">
      </div>
      <button class="submit-btn" onclick="handleSignup()" id="signupBtn">Create employer account</button>
      <div class="terms-note">By creating an account you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</div>
    </div>

    <!-- LOGIN -->
    <div class="auth-form" id="loginForm">
      <div class="auth-error" id="loginError"></div>
      <div class="auth-success" id="loginSuccess"></div>
      <div class="form-field">
        <label>Email address</label>
        <input type="email" id="loginEmail" placeholder="your@company.com">
      </div>
      <div class="form-field">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Your password">
      </div>
      <a href="#" class="forgot-link" onclick="handleForgotPassword()">Forgot password?</a>
      <button class="submit-btn" onclick="handleLogin()" id="loginBtn">Sign in</button>
    </div>

  </div>
</main>

<footer>
  <a href="index.html" class="logo" style="color:white;text-decoration:none;font-size:16px">vett<span style="color:#10b981">.</span>work</a>
  <p>For the people who do the lot · 2025</p>
</footer>

<script>
const SUPABASE_URL = 'https://gsdjlfdodauuwqspjpae.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdzZGpsZmRvZGF1dXdxc3BqcGFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MjcyMTYsImV4cCI6MjA5NTAwMzIxNn0.LDpg0VfUtYKdactmSfn7HqHSVzkWNTK-FZCZjNjXU5M';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

supabase.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.href = 'employer-dashboard.html';
});

function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((t, i) => {
    t.classList.toggle('active', (tab === 'signup' && i === 0) || (tab === 'login' && i === 1));
  });
  document.getElementById('signupForm').classList.toggle('active', tab === 'signup');
  document.getElementById('loginForm').classList.toggle('active', tab === 'login');
}

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.add('show');
}

function hideError(id) {
  document.getElementById(id).classList.remove('show');
}

function showSuccess(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.add('show');
}

async function handleSignup() {
  hideError('signupError');
  const first = document.getElementById('signupFirst').value.trim();
  const last = document.getElementById('signupLast').value.trim();
  const company = document.getElementById('signupCompany').value.trim();
  const companyType = document.getElementById('signupCompanyType').value;
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;

  if (!first || !email || !password || !company) {
    showError('signupError', 'Please fill in all required fields');
    return;
  }
  if (password.length < 8) {
    showError('signupError', 'Password must be at least 8 characters');
    return;
  }

  const btn = document.getElementById('signupBtn');
  btn.textContent = 'Creating account...';
  btn.disabled = true;

  try {
    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      options: {
        data: { first_name: first, last_name: last, role: 'employer' }
      }
    });

    if (error) throw error;

    if (data.user) {
      await supabase.from('employers').insert({
        user_id: data.user.id,
        email,
        company_name: company,
        company_type: companyType || null,
      });
    }

    showSuccess('signupSuccess', 'Account created! Check your email to confirm your address, then sign in.');
    btn.textContent = 'Account created';

  } catch (err) {
    showError('signupError', err.message || 'Something went wrong — please try again');
    btn.textContent = 'Create employer account';
    btn.disabled = false;
  }
}

async function handleLogin() {
  hideError('loginError');
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;

  if (!email || !password) {
    showError('loginError', 'Please enter your email and password');
    return;
  }

  const btn = document.getElementById('loginBtn');
  btn.textContent = 'Signing in...';
  btn.disabled = true;

  try {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) throw error;
    window.location.href = 'employer-dashboard.html';
  } catch (err) {
    showError('loginError', err.message || 'Invalid email or password');
    btn.textContent = 'Sign in';
    btn.disabled = false;
  }
}

async function handleForgotPassword() {
  const email = document.getElementById('loginEmail').value.trim();
  if (!email) { showError('loginError', 'Enter your email address first'); return; }

  const { error } = await supabase.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/employer-reset.html',
  });

  if (error) {
    showError('loginError', error.message);
  } else {
    showSuccess('loginSuccess', 'Password reset email sent — check your inbox.');
  }
}
</script>
</body>
</html>
